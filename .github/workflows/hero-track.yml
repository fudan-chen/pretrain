name: Hero Track v2

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hero-track-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require a branch ref
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "Hero Track v2 must run from a branch, not $REF_TYPE."
            exit 1
          fi

      - name: Refresh public evidence and build v2
        run: python scripts/track_hero.py update

      - name: Validate refreshed products
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q scripts tests
          python scripts/check_site.py

      - name: Commit only evidence and v2 outputs
        run: |
          git add data/hero data/baselines data/derived reports/generated site
          if git diff --cached --quiet; then
            echo "No v2 changes to commit."
            exit 0
          fi
          git config user.name "marin-track-bot"
          git config user.email "marin-track-bot@users.noreply.github.com"
          git commit -m "track: update Hero v2 evidence and derived outputs"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: track
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the refreshed main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload v2 site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy v2 site
        id: deployment
        uses: actions/deploy-pages@v4
